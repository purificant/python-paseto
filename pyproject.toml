[project]
name = "python-paseto"
version = "0.5.2"
description = "Platform-Agnostic Security Tokens for Python"
authors = []
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4.0"
keywords = ["paseto", "token", "security", "crypto"]
dynamic = ["classifiers", "dependencies"]

[project.urls]
homepage = "https://github.com/purificant/python-paseto"
repository = "https://github.com/purificant/python-paseto"
documentation = "https://github.com/purificant/python-paseto"

[tool.poetry]
requires-poetry = ">=2.5"
packages = [{ include = "paseto" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Development Status :: 5 - Production/Stable",
]

[tool.poetry.dependencies]
pysodium = "^0.7.17"

[tool.poetry.group.dev.dependencies]
codespell = "^2.2.6"
coverage = "^7"
cython = "^3.0.7"
mypy = "^1.7"
pylint = "^4.0"
pynacl = "^1.5"
pip-audit = "^2.10"
pre-commit = "^4.0"
pytest = "^9.0"
pytest-benchmark = "^5.2"
ruff = "^0.17.0"
setuptools = "^84.0"

[tool.ruff]
# vendored code, not ours to lint or format
extend-exclude = ["submodules"]

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.10.1"
